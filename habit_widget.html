<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<!-- Google Material Icons CDN -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  /* Notion Dark Theme (デフォルト) */
  :root {
    --bg-color: #191919;            
    --card-bg: #202020;             
    --card-hover-bg: #262626;
    --border-color: #2f2f2f;         
    --text-color: #d4d4d4;           
    --text-title: #e3e3e3;
    --text-sub: #787774;             
    --color-empty: #252525;
    --color-filled: #2eaadc;         
    --overlay-bg: rgba(0,0,0,0.6);
    --shadow-color: rgba(0, 0, 0, 0.6);

    --theme-dynamic-color: #ffffff;
    --theme-dynamic-border: transparent;
  }

  /* Notion Light Theme */
  :root[data-theme="light"] {
    --bg-color: #ffffff;            
    --card-bg: #f7f6f3;             
    --card-hover-bg: #f0efeC;
    --border-color: #e9e9e8;         
    --text-color: #37352f;           
    --text-title: #222222;
    --text-sub: #9b9a97;             
    --color-empty: #ecebe8;
    --color-filled: #0b6e99;         
    --overlay-bg: rgba(15, 15, 15, 0.4);
    --shadow-color: rgba(15, 15, 15, 0.1);

    --theme-dynamic-color: #191919;
    --theme-dynamic-border: transparent;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 16px;
    font-size: 14px;
    position: relative;
    overflow-x: hidden;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  /* ヘッダー */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  /* iOS風セグメントコントロール（スイッチの色を #3d90e1 に変更） */
  .ios-segmented-control {
    position: relative;
    display: flex;
    align-items: center;
    background-color: rgba(120, 120, 128, 0.16);
    border-radius: 16px;
    padding: 2px;
    width: 140px;
    height: 28px;
    user-select: none;
  }
  .ios-segmented-control .slider-bg {
    position: absolute;
    top: 2px;
    left: 2px;
    width: calc(50% - 2px);
    height: calc(100% - 4px);
    background-color: #3d90e1;
    border-radius: 14px;
    box-shadow: 0px 1px 4px rgba(0, 0, 0, 0.15);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.25s ease;
    z-index: 1;
  }
  .ios-segmented-control .option {
    position: relative;
    flex: 1;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-sub);
    cursor: pointer;
    z-index: 2;
    transition: color 0.2s ease, font-weight 0.2s ease;
    line-height: 24px;
  }
  .ios-segmented-control .option.active {
    color: #ffffff;
    font-weight: 600;
  }
  .ios-segmented-control[data-active="compact"] .slider-bg {
    transform: translateX(100%);
  }

  /* コントロールボタン群（円形＝丸に変更） */
  .controls { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--card-bg);
    border: none;
    color: var(--text-color);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.1s, color 0.2s;
  }
  .icon-btn .material-icons { font-size: 16px; }
  .icon-btn:hover { background: var(--card-hover-bg); }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn.active { background: #3d90e1; color: white; }

  /* サイドバー */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay-bg);
    z-index: 150;
    backdrop-filter: blur(2px);
  }
  .sidebar-overlay.open { display: block; }
  .sidebar {
    position: fixed;
    top: 0; right: -280px;
    width: 280px; height: 100%;
    background: var(--card-bg);
    border-top-left-radius: 20px;
    border-bottom-left-radius: 20px;
    z-index: 200;
    padding: 24px;
    transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .sidebar.open { right: 0; }
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
  }
  .sidebar-title { font-weight: 600; font-size: 15px; color: var(--text-title); }
  .close-btn {
    background: var(--bg-color);
    border: none;
    border-radius: 50%;
    width: 28px; height: 28px;
    color: var(--text-sub);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn:hover { color: var(--text-color); }

  /* スイッチ */
  .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .switch { position: relative; display: inline-block; width: 44px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background-color: rgba(120, 120, 128, 0.32);
    transition: .3s cubic-bezier(0.2, 0.8, 0.2, 1);
    border-radius: 26px;
  }
  .slider:before {
    position: absolute; content: "";
    height: 22px; width: 22px; left: 2px; bottom: 2px;
    background-color: #ffffff;
    transition: .3s cubic-bezier(0.2, 0.8, 0.2, 1);
    border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  input:checked + .slider { background-color: #34c759; }
  input:checked + .slider:before { transform: translateX(18px); }

  /* クイックチェック */
  #quick-check-panel {
    display: none;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
  }
  #quick-check-panel.open { display: block; }
  .quick-check-title { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; }
  .quick-check-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .quick-check-item {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-color);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    transition: background 0.2s, color 0.2s;
  }
  .quick-check-item .material-icons { font-size: 16px; }

  /* トラッカーカード */
  .tracker-list { display: flex; flex-direction: column; gap: 16px; position: relative; }
  .tracker-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 14px;
    position: relative;
    cursor: grab;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease;
  }
  .tracker-card:active { cursor: grabbing; }
  .tracker-card:hover {
    transform: translateY(-4px);
    background-color: var(--card-hover-bg);
    box-shadow: 0 12px 24px -4px var(--shadow-color), 0 4px 8px -2px var(--shadow-color);
  }
  .tracker-card.dragging { opacity: 0.3; transform: none !important; box-shadow: none !important; }
  .tracker-card.drag-over { box-shadow: 0 0 0 2px var(--color-filled) !important; }

  .tracker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .tracker-name-wrapper { display: flex; align-items: center; flex-grow: 1; margin-right: 8px; min-width: 0; }
  .tracker-name { 
    font-weight: 600; color: var(--text-title); cursor: pointer; user-select: none;
    padding: 2px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tracker-name:hover { background: rgba(125, 125, 125, 0.1); }
  .tracker-name-input {
    font-weight: 600; color: var(--text-title); background: var(--bg-color);
    border: 1px solid var(--border-color); border-radius: 4px; padding: 2px 6px; font-size: 14px;
    outline: none; width: 100%; max-width: 200px;
  }
  .tracker-name-input:focus { border-color: var(--color-filled); }

  .delete-btn {
    background: none; border: none; color: var(--text-sub); cursor: pointer; padding: 4px;
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, color 0.2s, background 0.2s;
  }
  .tracker-card:hover .delete-btn { opacity: 1; pointer-events: auto; }
  .delete-btn .material-icons { font-size: 18px; }
  .delete-btn:hover { color: #ff5555; background: rgba(255, 85, 85, 0.1); }

  /* グラフ表示 */
  .tracker-body { display: flex; overflow: hidden; padding-bottom: 4px; }
  .weekday-labels {
    display: grid; grid-template-rows: repeat(7, 10px); gap: 3px;
    margin-top: 18px; margin-right: 6px; font-size: 9px; color: var(--text-sub);
    line-height: 10px; user-select: none; flex-shrink: 0;
  }
  .weekday-labels div { height: 10px; }

  .graph-container { display: flex; flex-direction: column; overflow-x: auto; width: 100%; align-items: flex-start; scrollbar-width: none; }
  .graph-container::-webkit-scrollbar { display: none; }
  .month-labels {
    display: grid; grid-template-columns: repeat(53, 10px); gap: 3px;
    height: 15px; margin-bottom: 3px; font-size: 10px; color: var(--text-sub);
    user-select: none; width: max-content;
  }
  .month-label { grid-row: 1; white-space: nowrap; }

  .grid {
    display: grid; grid-template-rows: repeat(7, 10px); grid-template-columns: repeat(53, 10px);
    grid-auto-flow: column; gap: 3px; width: max-content;
  }
  .day-block { width: 10px; height: 10px; background-color: var(--color-empty); border-radius: 3px; transition: background-color 0.15s ease; }

  /* 4週間モード */
  .mode-4weeks { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
  .mode-4weeks .tracker-header { margin-bottom: 0; flex-shrink: 0; max-width: 40%; }
  .mode-4weeks .weekday-labels, .mode-4weeks .month-labels { display: none !important; }
  .mode-4weeks .tracker-body { padding-bottom: 0; flex-grow: 1; justify-content: flex-start; overflow: hidden; }
  .mode-4weeks .graph-container { width: 100%; align-items: flex-start; overflow-x: auto; }
  .mode-4weeks .grid { display: flex !important; flex-direction: row; gap: 4px; width: max-content; }
  .mode-4weeks .day-block { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  /* 共通モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: var(--overlay-bg); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; z-index: 300;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card-bg); border-radius: 20px; padding: 20px;
    width: 320px; box-shadow: 0 10px 30px var(--shadow-color);
  }
  .modal h3 { margin-bottom: 14px; font-size: 15px; color: var(--text-title); }
  .modal input[type="text"] {
    width: 100%; padding: 10px 14px; background: var(--bg-color);
    border: 1px solid var(--border-color); border-radius: 10px;
    color: var(--text-color); margin-bottom: 16px; outline: none;
  }
  .modal input[type="text"]:focus { border-color: var(--color-filled); }

  .color-picker-label { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; display: block; }
  .color-palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; padding: 4px 0; }
  .color-option {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, border-color 0.15s ease; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }
  .color-option:hover { transform: scale(1.15); }
  .color-option.selected { transform: scale(1.2); border-color: var(--text-title); box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--text-title); }
  .color-option .check-icon { font-size: 15px; display: none; user-select: none; }
  .color-option.selected .check-icon { display: block; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-actions button {
    padding: 8px 16px; border-radius: 10px; border: none; background: var(--bg-color);
    color: var(--text-color); cursor: pointer; font-size: 13px;
  }
  .modal-actions button:hover { background: var(--card-hover-bg); }
  .btn-primary { background: #3d90e1 !important; color: white !important; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-danger { background: #e54d42 !important; color: white !important; }
  .btn-danger:hover { background: #c83b31 !important; }
</style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="ios-segmented-control" id="view-segmented-control" data-active="normal">
      <div class="slider-bg"></div>
      <div class="option active" id="view-normal-btn">基本</div>
      <div class="option" id="view-compact-btn">コンパクト</div>
    </div>
    <div class="controls">
      <button class="icon-btn" id="toggle-check-btn" title="今日の完了確認"><span class="material-icons">done</span></button>
      <button class="icon-btn" id="add-tracker-btn" title="トラッカーの追加"><span class="material-icons">add</span></button>
      <button class="icon-btn" id="open-sidebar-btn" title="設定"><span class="material-icons">settings</span></button>
    </div>
  </div>

  <!-- サイドバー -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">設定</span>
      <button class="close-btn" id="close-sidebar-btn"><span class="material-icons">close</span></button>
    </div>
    <div class="setting-item">
      <span>ライトテーマ</span>
      <label class="switch">
        <input type="checkbox" id="toggle-theme-mode">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div id="quick-check-panel">
    <div class="quick-check-title">今日のタスク完了を記録:</div>
    <div class="quick-check-list" id="quick-check-list"></div>
  </div>

  <!-- メインリスト -->
  <div class="tracker-list" id="tracker-list"></div>

  <!-- 追加モーダル -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <h3>新しいトラッカーを追加</h3>
      <input type="text" id="tracker-name-input" placeholder="習慣の名前 (例: 読書)" maxlength="25">
      <span class="color-picker-label">テーマカラーを選択:</span>
      <div class="color-palette" id="add-color-palette"></div>
      <div class="modal-actions">
        <button class="modal-close-btn">キャンセル</button>
        <button class="btn-primary" id="save-add-btn">追加</button>
      </div>
    </div>
  </div>

  <!-- カラー編集モーダル -->
  <div class="modal-overlay" id="color-modal">
    <div class="modal">
      <h3>カラーを変更</h3>
      <div class="color-palette" id="edit-color-palette"></div>
      <div class="modal-actions">
        <button class="modal-close-btn">キャンセル</button>
        <button class="btn-primary" id="save-color-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 削除モーダル -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <h3>トラッカーの削除</h3>
      <p style="color: var(--text-sub); font-size: 13px; margin-bottom: 16px;" id="delete-modal-text">本当に削除しますか？</p>
      <div class="modal-actions">
        <button class="modal-close-btn">キャンセル</button>
        <button class="btn-danger" id="confirm-delete-btn">削除</button>
      </div>
    </div>
  </div>

<script>
  const COLOR_PALETTE = [
    { id: 'blue', name: 'ブルー', hex: '#2eaadc', textLight: true },
    { id: 'green', name: 'グリーン', hex: '#2eac6d', textLight: true },
    { id: 'purple', name: 'パープル', hex: '#9a6dd7', textLight: true },
    { id: 'pink', name: 'ピンク', hex: '#e056fd', textLight: true },
    { id: 'red', name: 'レッド', hex: '#ff5252', textLight: true },
    { id: 'orange', name: 'オレンジ', hex: '#ff793f', textLight: true },
    { id: 'yellow', name: 'イエロー', hex: '#f7b731', textLight: false },
    { id: 'theme-dynamic', name: 'テーマ連動', hex: 'var(--theme-dynamic-color)', border: 'var(--theme-dynamic-border)', isDynamic: true }
  ];

  let trackers = JSON.parse(localStorage.getItem('github-trackers') || '[]');
  let is4WeeksMode = localStorage.getItem('github-tracker-4weeks') === 'true';
  let isLightTheme = localStorage.getItem('github-tracker-theme') === 'light';

  let activeColorSelection = COLOR_PALETTE[0].hex;
  let targetTrackerId = null;
  let draggedCard = null, draggedId = null;

  // DOM Elements
  const trackerListEl = document.getElementById('tracker-list');
  const quickCheckPanel = document.getElementById('quick-check-panel');
  const quickCheckList = document.getElementById('quick-check-list');
  const viewSegmentedControl = document.getElementById('view-segmented-control');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');
  const toggleThemeModeInput = document.getElementById('toggle-theme-mode');

  // --- 共通ユーティリティ ---
  const saveState = () => localStorage.setItem('github-trackers', JSON.stringify(trackers));
  const getTodayString = () => new Date().toISOString().split('T')[0];
  const toggleModal = (modalId, isOpen) => document.getElementById(modalId).classList.toggle('open', isOpen);

  function applyTheme(isLight) {
    if (isLight) document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }

  // --- カラーパレット描画 (共通化) ---
  function renderPalette(containerEl, selectedHex, onSelect) {
    containerEl.innerHTML = '';
    activeColorSelection = selectedHex;
    COLOR_PALETTE.forEach(c => {
      const opt = document.createElement('div');
      opt.className = 'color-option' + (c.hex === selectedHex ? ' selected' : '');
      opt.style.backgroundColor = c.hex;
      if (c.border) opt.style.borderColor = c.border;
      
      const checkIcon = document.createElement('span');
      checkIcon.className = 'material-icons check-icon';
      checkIcon.textContent = 'check';
      checkIcon.style.color = c.isDynamic ? (isLightTheme ? '#fff' : '#000') : (c.textLight ? '#fff' : '#000');
      opt.appendChild(checkIcon);

      opt.onclick = () => {
        containerEl.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        opt.classList.add('selected');
        activeColorSelection = c.hex;
        if (onSelect) onSelect(c.hex);
      };
      containerEl.appendChild(opt);
    });
  }

  // --- 描画メイン処理 ---
  function render() {
    // スイッチUI状態更新
    viewSegmentedControl.setAttribute('data-active', is4WeeksMode ? 'compact' : 'normal');
    document.getElementById('view-normal-btn').classList.toggle('active', !is4WeeksMode);
    document.getElementById('view-compact-btn').classList.toggle('active', is4WeeksMode);

    trackerListEl.innerHTML = trackers.length === 0 
      ? '<div style="color:var(--text-sub); text-align:center; padding: 20px 0;">右上ボタンからトラッカーを追加してください</div>' 
      : '';
    quickCheckList.innerHTML = '';

    const todayStr = getTodayString();
    const today = new Date();

    trackers.forEach(t => {
      const cardColor = t.color || COLOR_PALETTE[0].hex;
      const isTodayDone = !!t.history[todayStr];

      // カード作成
      const card = document.createElement('div');
      card.className = 'tracker-card' + (is4WeeksMode ? ' mode-4weeks' : '');
      card.draggable = true;
      card.dataset.id = t.id;
      card.innerHTML = `
        <div class="tracker-header">
          <div class="tracker-name-wrapper">
            <span class="tracker-name" title="ダブルクリックでタイトル編集">${t.name}</span>
          </div>
          <button class="delete-btn" title="削除"><span class="material-icons">close</span></button>
        </div>
        <div class="tracker-body">
          <div class="weekday-labels"><div>月</div><div></div><div>水</div><div></div><div>金</div><div></div><div>日</div></div>
          <div class="graph-container">
            <div class="month-labels"></div>
            <div class="grid"></div>
          </div>
        </div>
      `;

      setupDragEvents(card, t.id);
      trackerListEl.appendChild(card);

      // グリッド生成
      const gridEl = card.querySelector('.grid');
      const monthLabelsEl = card.querySelector('.month-labels');
      const containerEl = card.querySelector('.graph-container');

      if (is4WeeksMode) {
        for (let i = 27; i >= 0; i--) {
          const d = new Date(today);
          d.setDate(today.getDate() - i);
          createBlock(gridEl, d.toISOString().split('T')[0], t.history, cardColor);
        }
      } else {
        const weeksCount = 53;
        const currentMondayIndex = (today.getDay() + 6) % 7;
        const startDate = new Date(today);
        startDate.setDate(today.getDate() - currentMondayIndex - ((weeksCount - 1) * 7));
        let lastMonth = -1;

        for (let week = 0; week < weeksCount; week++) {
          for (let day = 0; day < 7; day++) {
            const d = new Date(startDate);
            d.setDate(startDate.getDate() + (week * 7) + day);
            if (d > today) {
              const empty = document.createElement('div');
              empty.style.cssText = 'width:10px; height:10px; visibility:hidden;';
              gridEl.appendChild(empty);
              continue;
            }
            const monthNum = d.getMonth() + 1;
            if (monthNum !== lastMonth) {
              const monthLabel = document.createElement('div');
              monthLabel.className = 'month-label';
              monthLabel.style.gridColumn = week + 1;
              monthLabel.textContent = `${monthNum}月`;
              monthLabelsEl.appendChild(monthLabel);
              lastMonth = monthNum;
            }
            createBlock(gridEl, d.toISOString().split('T')[0], t.history, cardColor);
          }
        }
      }

      requestAnimationFrame(() => containerEl.scrollLeft = containerEl.scrollWidth);

      // クイックチェックリスト要素生成
      const checkItem = document.createElement('div');
      checkItem.className = 'quick-check-item' + (isTodayDone ? ' checked' : '');
      if (isTodayDone) {
        checkItem.style.color = cardColor;
        checkItem.style.backgroundColor = cardColor === 'var(--theme-dynamic-color)' ? 'rgba(125,125,125,0.15)' : cardColor + '26';
      }
      checkItem.innerHTML = `<span class="material-icons">${isTodayDone ? 'check_box' : 'check_box_outline_blank'}</span> <span>${t.name}</span>`;
      checkItem.onclick = () => toggleToday(t.id);
      quickCheckList.appendChild(checkItem);
    });
  }

  function createBlock(parentGrid, dateStr, history, color) {
    const block = document.createElement('div');
    const isDone = !!history[dateStr];
    block.className = 'day-block' + (isDone ? ' filled' : '');
    if (isDone) block.style.backgroundColor = color;
    block.title = `${dateStr}: ${isDone ? '完了' : '未完了'}`;
    parentGrid.appendChild(block);
  }

  // --- イベント委任（Event Delegation） ---
  trackerListEl.addEventListener('dblclick', (e) => {
    const card = e.target.closest('.tracker-card');
    if (!card) return;
    const id = card.dataset.id;
    const tracker = trackers.find(t => t.id === id);

    if (e.target.classList.contains('tracker-name')) {
      startInlineEdit(id, e.target);
    } else if (!e.target.closest('.delete-btn') && !e.target.closest('input')) {
      targetTrackerId = id;
      renderPalette(document.getElementById('edit-color-palette'), tracker.color || COLOR_PALETTE[0].hex);
      toggleModal('color-modal', true);
    }
  });

  trackerListEl.addEventListener('click', (e) => {
    const deleteBtn = e.target.closest('.delete-btn');
    if (deleteBtn) {
      const card = deleteBtn.closest('.tracker-card');
      targetTrackerId = card.dataset.id;
      const tracker = trackers.find(t => t.id === targetTrackerId);
      document.getElementById('delete-modal-text').textContent = `「${tracker.name}」を削除してもよろしいですか？`;
      toggleModal('delete-modal', true);
    }
  });

  document.querySelectorAll('.modal-close-btn').forEach(btn => {
    btn.onclick = (e) => e.target.closest('.modal-overlay').classList.remove('open');
  });

  // --- インラインタイトル編集 ---
  function startInlineEdit(id, nameSpan) {
    const currentName = nameSpan.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'tracker-name-input';
    input.value = currentName;
    input.maxLength = 25;

    nameSpan.parentElement.replaceChild(input, nameSpan);
    input.focus();
    input.select();

    const saveEdit = () => {
      const newName = input.value.trim();
      if (newName && newName !== currentName) {
        const tracker = trackers.find(t => t.id === id);
        if (tracker) { tracker.name = newName; saveState(); }
      }
      render();
    };
    input.addEventListener('blur', saveEdit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveEdit();
      if (e.key === 'Escape') render();
    });
  }

  // --- ドラッグ＆ドロップ ---
  function setupDragEvents(card, id) {
    card.addEventListener('dragstart', (e) => {
      if (e.target.tagName.toLowerCase() === 'input') return e.preventDefault();
      draggedCard = card; draggedId = id;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.tracker-card').forEach(c => c.classList.remove('drag-over'));
      draggedCard = null; draggedId = null;
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (card !== draggedCard) card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (draggedCard && card !== draggedCard) {
        const fromIndex = trackers.findIndex(t => t.id === draggedId);
        const toIndex = trackers.findIndex(t => t.id === id);
        if (fromIndex !== -1 && toIndex !== -1) {
          const cardsBefore = Array.from(document.querySelectorAll('.tracker-card'));
          const firstPositions = new Map(cardsBefore.map(c => [c.dataset.id, c.getBoundingClientRect().top]));

          const [moved] = trackers.splice(fromIndex, 1);
          trackers.splice(toIndex, 0, moved);
          saveState(); render();

          Array.from(document.querySelectorAll('.tracker-card')).forEach(c => {
            const firstTop = firstPositions.get(c.dataset.id);
            if (firstTop !== undefined) {
              const deltaY = firstTop - c.getBoundingClientRect().top;
              if (deltaY !== 0) {
                c.style.transform = `translateY(${deltaY}px)`;
                c.style.transition = 'none';
                requestAnimationFrame(() => requestAnimationFrame(() => {
                  c.style.transition = 'transform 0.3s cubic-bezier(0.2, 0, 0, 1)';
                  c.style.transform = 'translateY(0)';
                  setTimeout(() => {
                    c.style.transform = '';
                    c.style.transition = '';
                  }, 300);
                }));
              }
            }
          });
        }
      }
    });
  }

  function toggleToday(id) {
    const tracker = trackers.find(t => t.id === id);
    if (!tracker) return;
    const todayStr = getTodayString();
    if (tracker.history[todayStr]) delete tracker.history[todayStr];
    else tracker.history[todayStr] = true;
    saveState(); render();
  }

  document.getElementById('save-add-btn').onclick = () => {
    const input = document.getElementById('tracker-name-input');
    const name = input.value.trim();
    if (name) {
      trackers.unshift({ id: crypto.randomUUID(), name, color: activeColorSelection, history: {} });
      saveState(); render();
      toggleModal('add-modal', false);
    }
  };
  document.getElementById('save-color-btn').onclick = () => {
    const tracker = trackers.find(t => t.id === targetTrackerId);
    if (tracker) { tracker.color = activeColorSelection; saveState(); render(); }
    toggleModal('color-modal', false);
  };
  document.getElementById('confirm-delete-btn').onclick = () => {
    trackers = trackers.filter(t => t.id !== targetTrackerId);
    saveState(); render();
    toggleModal('delete-modal', false);
  };

  // 表示切替
  document.getElementById('view-normal-btn').onclick = () => {
    if (!is4WeeksMode) return;
    is4WeeksMode = false; localStorage.setItem('github-tracker-4weeks', false); render();
  };
  document.getElementById('view-compact-btn').onclick = () => {
    if (is4WeeksMode) return;
    is4WeeksMode = true; localStorage.setItem('github-tracker-4weeks', true); render();
  };

  // サイドバー・テーマ
  document.getElementById('open-sidebar-btn').onclick = () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('open'); };
  const closeSidebar = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); };
  document.getElementById('close-sidebar-btn').onclick = closeSidebar;
  sidebarOverlay.onclick = closeSidebar;

  applyTheme(isLightTheme);
  toggleThemeModeInput.checked = isLightTheme;
  toggleThemeModeInput.onchange = (e) => {
    isLightTheme = e.target.checked;
    localStorage.setItem('github-tracker-theme', isLightTheme ? 'light' : 'dark');
    applyTheme(isLightTheme); render();
  };

  document.getElementById('toggle-check-btn').onclick = (e) => {
    quickCheckPanel.classList.toggle('open');
    e.currentTarget.classList.toggle('active');
  };

  document.getElementById('add-tracker-btn').onclick = () => {
    document.getElementById('tracker-name-input').value = '';
    renderPalette(document.getElementById('add-color-palette'), COLOR_PALETTE[0].hex);
    toggleModal('add-modal', true);
    document.getElementById('tracker-name-input').focus();
  };

  window.addEventListener('resize', () => {
    document.querySelectorAll('.graph-container').forEach(el => el.scrollLeft = el.scrollWidth);
  });

  render();
</script>
</body>
</html>
