<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<style>
  :root {
    --bg-color: #191919;            /* Notion Dark Background */
    --card-bg: #202020;             /* Notion Card / Component Background */
    --border-color: #2f2f2f;         /* Notion Subtle Border */
    --text-color: #d4d4d4;           /* Notion Main Text */
    --text-sub: #787774;             /* Notion Sub Text */
    --color-empty: #252525;
    --color-empty-border: #2f2f2f;
    --color-filled: #2eaadc;         /* Notion Accent Blue */
    --color-filled-border: #258db8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* ページ全体のスクロールバーを完全に排除 */
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden !important;
    -ms-overflow-style: none; /* IE, Edge */
    scrollbar-width: none; /* Firefox */
  }
  
  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    display: none !important; /* Chrome, Safari, Notion Electron */
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 16px;
    font-size: 14px;
    position: relative;
  }

  /* ヘッダー */
  .header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
  }
  .controls {
    display: flex;
    gap: 10px;
  }
  .icon-btn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    width: 36px;
    height: 36px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
  }
  .icon-btn:hover {
    background: #2a2a2a;
    border-color: #3f3f3f;
  }
  .icon-btn:active {
    transform: scale(0.95);
  }
  .icon-btn.active {
    background: #2eaadc;
    border-color: #2eaadc;
    color: white;
  }

  /* 設定サイドバー */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 150;
    backdrop-filter: blur(2px);
  }
  .sidebar-overlay.open {
    display: block;
  }
  .sidebar {
    position: fixed;
    top: 0;
    right: -280px;
    width: 280px;
    height: 100%;
    background: var(--card-bg);
    border-left: 1px solid var(--border-color);
    border-top-left-radius: 20px;
    border-bottom-left-radius: 20px;
    z-index: 200;
    padding: 24px;
    transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
  }
  .sidebar.open {
    right: 0;
  }
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
  }
  .sidebar-title {
    font-weight: 600;
    font-size: 15px;
    color: #e3e3e3;
  }
  .close-btn {
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    color: var(--text-sub);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn:hover { color: var(--text-color); border-color: #444; }

  /* トグルスイッチ */
  .setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #333;
    transition: .2s;
    border-radius: 22px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background-color: #e3e3e3;
    transition: .2s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: #2eaadc; }
  input:checked + .slider:before { transform: translateX(18px); background-color: #fff; }

  /* クイックチェックパネル */
  #quick-check-panel {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
  }
  #quick-check-panel.open { display: block; }
  .quick-check-title {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 10px;
  }
  .quick-check-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .quick-check-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    transition: background 0.2s, border-color 0.2s;
  }
  .quick-check-item.checked {
    border-color: #2eaadc;
    background: rgba(46, 170, 220, 0.15);
    color: #45b7e5;
  }

  /* トラッカー一覧 */
  .tracker-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
  }

  /* カードスタイル & アニメーション */
  .tracker-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 14px;
    position: relative;
    will-change: transform;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .tracker-card.dragging {
    opacity: 0.3;
    border: 1px dashed var(--text-sub);
  }
  .tracker-card.drag-over {
    border-color: #2eaadc;
    box-shadow: 0 0 12px rgba(46, 170, 220, 0.25);
  }

  .tracker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .tracker-name { font-weight: 600; color: #e3e3e3; }
  .tracker-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .drag-handle {
    color: var(--text-sub);
    cursor: grab;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 6px;
    user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle:hover { color: var(--text-color); background: rgba(255,255,255,0.05); }

  /* 草グラフ構造 */
  .tracker-body {
    display: flex;
    overflow-x: auto; /* グラフ部分のみ必要に応じて横スクロール可能に */
    overflow-y: hidden;
    padding-bottom: 4px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .tracker-body::-webkit-scrollbar {
    display: none;
  }

  .weekday-labels {
    display: grid;
    grid-template-rows: repeat(7, 10px);
    gap: 3px;
    margin-top: 18px;
    margin-right: 6px;
    font-size: 9px;
    color: var(--text-sub);
    line-height: 10px;
    user-select: none;
    flex-shrink: 0;
  }
  .weekday-labels div { height: 10px; }

  .graph-container {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    width: 100%;
    align-items: flex-end;
  }

  .month-labels {
    display: grid;
    grid-template-columns: repeat(53, 10px);
    gap: 3px;
    height: 15px;
    margin-bottom: 3px;
    font-size: 10px;
    color: var(--text-sub);
    user-select: none;
    width: max-content;
  }
  .month-label { grid-row: 1; white-space: nowrap; }

  .grid {
    display: grid;
    grid-template-rows: repeat(7, 10px);
    grid-template-columns: repeat(53, 10px);
    grid-auto-flow: column;
    gap: 3px;
    width: max-content;
  }
  .day-block {
    width: 10px;
    height: 10px;
    background-color: var(--color-empty);
    border: 1px solid var(--color-empty-border);
    border-radius: 3px;
  }
  .day-block.filled {
    background-color: var(--color-filled);
    border-color: var(--color-filled-border);
  }

  /* 2週間1列表示モード用スタイル調整 */
  .mode-2weeks .weekday-labels,
  .mode-2weeks .month-labels,
  .mode-2weeks .drag-handle {
    display: none !important;
  }
  .mode-2weeks .grid {
    display: flex !important;
    flex-direction: row;
    gap: 5px;
    width: 100%;
    justify-content: flex-start;
  }
  .mode-2weeks .tracker-body {
    padding-bottom: 0;
    overflow: hidden;
  }
  .mode-2weeks .day-block {
    width: 14px;
    height: 14px;
    border-radius: 4px;
  }

  /* モーダル */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  .modal {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 20px;
    width: 300px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .modal h3 { margin-bottom: 14px; font-size: 15px; color: #e3e3e3; }
  .modal input {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-color);
    margin-bottom: 16px;
    outline: none;
  }
  .modal input:focus {
    border-color: #2eaadc;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--bg-color);
    color: var(--text-color);
    cursor: pointer;
    font-size: 13px;
  }
  .modal-actions button:hover {
    background: #2a2a2a;
  }
  .btn-primary { background: #2eaadc !important; color: white !important; border: none !important; }
  .btn-primary:hover { background: #258db8 !important; }
</style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="controls">
      <button class="icon-btn" id="toggle-check-btn" title="今日の完了確認">✓</button>
      <button class="icon-btn" id="add-tracker-btn" title="トラッカーの追加">＋</button>
      <button class="icon-btn" id="open-sidebar-btn" title="設定">⚙️</button>
    </div>
  </div>

  <!-- 設定サイドバー -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">設定</span>
      <button class="close-btn" id="close-sidebar-btn">✕</button>
    </div>
    <div class="setting-item">
      <span>2週間コンパクト表示</span>
      <label class="switch">
        <input type="checkbox" id="toggle-2weeks-mode">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div id="quick-check-panel">
    <div class="quick-check-title">今日のタスク完了を記録:</div>
    <div class="quick-check-list" id="quick-check-list"></div>
  </div>

  <div class="tracker-list" id="tracker-list"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3>新しいトラッカーを追加</h3>
      <input type="text" id="tracker-name-input" placeholder="習慣の名前 (例: 読書)" maxlength="25">
      <div class="modal-actions">
        <button id="cancel-btn">キャンセル</button>
        <button class="btn-primary" id="save-btn">追加</button>
      </div>
    </div>
  </div>

<script>
  let trackers = JSON.parse(localStorage.getItem('github-trackers') || '[]');
  let is2WeeksMode = localStorage.getItem('github-tracker-2weeks') === 'true';

  const trackerListEl = document.getElementById('tracker-list');
  const quickCheckPanel = document.getElementById('quick-check-panel');
  const quickCheckList = document.getElementById('quick-check-list');
  const toggleCheckBtn = document.getElementById('toggle-check-btn');
  const addTrackerBtn = document.getElementById('add-tracker-btn');
  const openSidebarBtn = document.getElementById('open-sidebar-btn');
  const closeSidebarBtn = document.getElementById('close-sidebar-btn');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');
  const toggle2WeeksModeInput = document.getElementById('toggle-2weeks-mode');
  
  const modal = document.getElementById('modal');
  const trackerNameInput = document.getElementById('tracker-name-input');
  const saveBtn = document.getElementById('save-btn');
  const cancelBtn = document.getElementById('cancel-btn');

  let draggedCard = null;
  let draggedId = null;

  function getTodayString() {
    const today = new Date();
    return today.toISOString().split('T')[0];
  }

  function saveState() {
    localStorage.setItem('github-trackers', JSON.stringify(trackers));
  }

  function render() {
    trackerListEl.innerHTML = '';
    quickCheckList.innerHTML = '';

    const todayStr = getTodayString();

    if(trackers.length === 0) {
      trackerListEl.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding: 20px 0;">右上ボタンからトラッカーを追加してください</div>';
    }

    trackers.forEach((t) => {
      const card = document.createElement('div');
      card.className = 'tracker-card' + (is2WeeksMode ? ' mode-2weeks' : '');
      card.draggable = !is2WeeksMode;
      card.dataset.id = t.id;

      const isTodayDone = !!t.history[todayStr];

      card.innerHTML = `
        <div class="tracker-header">
          <span class="tracker-name">${t.name}</span>
          <div class="tracker-header-actions">
            <span class="drag-handle" title="ドラッグして並べ替え">≡</span>
          </div>
        </div>
        <div class="tracker-body">
          <div class="weekday-labels">
            <div>月</div><div></div><div>水</div><div></div><div>金</div><div></div><div>日</div>
          </div>
          <div class="graph-container">
            <div class="month-labels" id="month-labels-${t.id}"></div>
            <div class="grid" id="grid-${t.id}"></div>
          </div>
        </div>
      `;

      if (!is2WeeksMode) {
        setupDragEvents(card, t.id);
      }
      
      trackerListEl.appendChild(card);

      const gridEl = card.querySelector(`#grid-${t.id}`);
      const monthLabelsEl = card.querySelector(`#month-labels-${t.id}`);
      const today = new Date();

      if (is2WeeksMode) {
        // --- 2週間（14日間）1列表示モード ---
        for (let i = 13; i >= 0; i--) {
          const d = new Date(today);
          d.setDate(today.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];

          const block = document.createElement('div');
          block.className = 'day-block' + (t.history[dateStr] ? ' filled' : '');
          block.title = `${dateStr}: ${t.history[dateStr] ? '完了' : '未完了'}`;
          gridEl.appendChild(block);
        }
      } else {
        // --- 通常（53週）表示モード ---
        const weeksCount = 53;
        const currentMondayIndex = (today.getDay() + 6) % 7;
        const startDate = new Date(today);
        startDate.setDate(today.getDate() - currentMondayIndex - ((weeksCount - 1) * 7));

        let lastMonth = -1;

        for (let week = 0; week < weeksCount; week++) {
          for (let day = 0; day < 7; day++) {
            const d = new Date(startDate);
            d.setDate(startDate.getDate() + (week * 7) + day);

            if (d > today) {
              const emptyBlock = document.createElement('div');
              emptyBlock.style.width = '10px';
              emptyBlock.style.height = '10px';
              emptyBlock.style.visibility = 'hidden';
              gridEl.appendChild(emptyBlock);
              continue;
            }

            const dateStr = d.toISOString().split('T')[0];
            const monthNum = d.getMonth() + 1;

            if (monthNum !== lastMonth) {
              const monthLabel = document.createElement('div');
              monthLabel.className = 'month-label';
              monthLabel.style.gridColumn = week + 1;
              monthLabel.textContent = `${monthNum}月`;
              monthLabelsEl.appendChild(monthLabel);
              lastMonth = monthNum;
            }

            const block = document.createElement('div');
            block.className = 'day-block' + (t.history[dateStr] ? ' filled' : '');
            block.title = `${dateStr}: ${t.history[dateStr] ? '完了' : '未完了'}`;
            gridEl.appendChild(block);
          }
        }
      }

      const checkItem = document.createElement('div');
      checkItem.className = 'quick-check-item' + (isTodayDone ? ' checked' : '');
      checkItem.innerHTML = `<span>${isTodayDone ? '✓' : '○'}</span> <span>${t.name}</span>`;
      checkItem.onclick = () => toggleToday(t.id);
      quickCheckList.appendChild(checkItem);
    });
  }

  function setupDragEvents(card, id) {
    card.addEventListener('dragstart', (e) => {
      draggedCard = card;
      draggedId = id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.tracker-card').forEach(c => c.classList.remove('drag-over'));
      draggedCard = null;
      draggedId = null;
    });

    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (card !== draggedCard) {
        card.classList.add('drag-over');
      }
    });

    card.addEventListener('dragleave', () => {
      card.classList.remove('drag-over');
    });

    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');

      if (draggedCard && card !== draggedCard) {
        const fromIndex = trackers.findIndex(t => t.id === draggedId);
        const toIndex = trackers.findIndex(t => t.id === id);

        if (fromIndex !== -1 && toIndex !== -1) {
          const cardsBefore = Array.from(document.querySelectorAll('.tracker-card'));
          const firstPositions = new Map();
          cardsBefore.forEach(c => {
            firstPositions.set(c.dataset.id, c.getBoundingClientRect().top);
          });

          const [movedTracker] = trackers.splice(fromIndex, 1);
          trackers.splice(toIndex, 0, movedTracker);
          saveState();

          render();

          const cardsAfter = Array.from(document.querySelectorAll('.tracker-card'));
          cardsAfter.forEach(c => {
            const cardId = c.dataset.id;
            const firstTop = firstPositions.get(cardId);
            if (firstTop !== undefined) {
              const lastTop = c.getBoundingClientRect().top;
              const deltaY = firstTop - lastTop;

              if (deltaY !== 0) {
                c.style.transform = `translateY(${deltaY}px)`;
                c.style.transition = 'none';

                requestAnimationFrame(() => {
                  requestAnimationFrame(() => {
                    c.style.transition = 'transform 0.3s cubic-bezier(0.2, 0, 0, 1)';
                    c.style.transform = 'translateY(0)';
                  });
                });
              }
            }
          });
        }
      }
    });
  }

  function toggleToday(id) {
    const tracker = trackers.find(t => t.id === id);
    if (!tracker) return;

    const todayStr = getTodayString();
    if (tracker.history[todayStr]) {
      delete tracker.history[todayStr];
    } else {
      tracker.history[todayStr] = true;
    }
    saveState();
    render();
  }

  function addTracker(name) {
    const newTracker = {
      id: crypto.randomUUID(),
      name: name,
      history: {}
    };
    trackers.unshift(newTracker);
    saveState();
    render();
  }

  /* サイドバー操作 */
  function openSidebar() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('open');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }

  openSidebarBtn.onclick = openSidebar;
  closeSidebarBtn.onclick = closeSidebar;
  sidebarOverlay.onclick = closeSidebar;

  // 2週間表示切り替え
  toggle2WeeksModeInput.checked = is2WeeksMode;
  toggle2WeeksModeInput.onchange = (e) => {
    is2WeeksMode = e.target.checked;
    localStorage.setItem('github-tracker-2weeks', is2WeeksMode);
    render();
  };

  toggleCheckBtn.onclick = () => {
    quickCheckPanel.classList.toggle('open');
    toggleCheckBtn.classList.toggle('active');
  };

  addTrackerBtn.onclick = () => {
    trackerNameInput.value = '';
    modal.style.display = 'flex';
    trackerNameInput.focus();
  };

  cancelBtn.onclick = () => {
    modal.style.display = 'none';
  };

  saveBtn.onclick = () => {
    const name = trackerNameInput.value.trim();
    if (name) {
      addTracker(name);
      modal.style.display = 'none';
    }
  };

  trackerNameInput.onkeydown = (e) => {
    if (e.key === 'Enter') saveBtn.click();
  };

  render();
</script>
</body>
</html>
